<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12月份個人財務管理系統</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f5f6fa; --card-bg: #ffffff; --primary: #2d3436; --accent: #0984e3; }
        body { font-family: sans-serif; background: var(--bg); padding: 15px; color: var(--primary); }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .summary-box { background: var(--primary); color: white; padding: 10px; border-radius: 8px; text-align: center; font-size: 0.9rem; }
        .summary-box.net { background: #10ac84; }
        .val { font-size: 1.1rem; font-weight: bold; display: block; margin-top: 5px; }
        .month-selector { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .month-btn { padding: 8px 12px; border: 1px solid #ddd; background: white; border-radius: 15px; cursor: pointer; white-space: nowrap; }
        .month-btn.active { background: var(--accent); color: white; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 8px 0; border-bottom: 1px solid #eee; }
        input { width: 80px; padding: 5px; text-align: right; border: 1px solid #ccc; border-radius: 4px; float: right; }
        .btn-group { display: flex; gap: 5px; margin-bottom: 15px; }
        .btn { padding: 10px; border: none; border-radius: 5px; color: white; cursor: pointer; flex: 1; font-weight: bold; }
        .btn-save { background: #0984e3; }
        .btn-export { background: #6c5ce7; }
        canvas { max-height: 250px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 style="margin:0">財務管理 App</h2>
        <div class="btn-group" style="width:100%">
            <button class="btn btn-save" onclick="saveData()">儲存資料</button>
            <button class="btn btn-export" onclick="exportCSV()">下載報表(備份)</button>
        </div>
    </header>

    <div id="month-bar" class="month-selector"></div>

    <div class="summary-grid">
        <div class="summary-box">總資產<span id="disp-assets" class="val">0</span></div>
        <div class="summary-box">總支出<span id="disp-liabilities" class="val">0</span></div>
        <div class="summary-box net">淨資產<span id="disp-net" class="val">0</span></div>
    </div>

    <div class="card">
        <strong style="color:var(--accent)">資產明細</strong>
        <table id="asset-table"></table>
        <canvas id="assetChart"></canvas>
    </div>

    <div class="card">
        <strong style="color:#e17055">負債與支出</strong>
        <table id="liability-table"></table>
    </div>
</div>

<script>
    let currentMonth = 1;
    let db = JSON.parse(localStorage.getItem('finance_db_v5')) || {};
    const assetFields = ["銀行存款", "股票/基金", "不動產", "外幣資產", "其他收入1", "其他收入2", "其他收入3"];
    const liabilityFields = ["房貸", "信貸", "車貸", "各項稅支出", "保險支出", "娛樂支出", "其他支出1", "其他支出2", "其他支出3"];
    let assetChart;

    function init() {
        const bar = document.getElementById('month-bar');
        for (let i = 1; i <= 12; i++) {
            bar.innerHTML += `<button class="month-btn ${i==1?'active':''}" id="m-${i}" onclick="switchMonth(${i})">${i}月</button>`;
        }
        renderTable('asset-table', assetFields, 'asset-in');
        renderTable('liability-table', liabilityFields, 'liability-in');
        setupChart();
        loadMonthData();
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js');
        }
    }

    function renderTable(id, fields, cls) {
        const table = document.getElementById(id);
        fields.forEach(f => {
            table.innerHTML += `<tr><td>${f}</td><td><input type="number" class="${cls}" data-name="${f}" oninput="calculate()"></td></tr>`;
        });
    }

    function calculate() {
        let totalA = 0, totalL = 0;
        document.querySelectorAll('.asset-in').forEach(i => totalA += Number(i.value || 0));
        document.querySelectorAll('.liability-in').forEach(i => totalL += Number(i.value || 0));
        document.getElementById('disp-assets').innerText = totalA.toLocaleString();
        document.getElementById('disp-liabilities').innerText = totalL.toLocaleString();
        document.getElementById('disp-net').innerText = (totalA - totalL).toLocaleString();
        updateChart(totalA);
    }

    function switchMonth(m) {
        saveToMemory();
        currentMonth = m;
        document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('m-'+m).classList.add('active');
        loadMonthData();
    }

    function saveToMemory() {
        const data = {};
        document.querySelectorAll('input').forEach(i => data[i.dataset.name] = i.value);
        db[currentMonth] = data;
    }

    function loadMonthData() {
        const data = db[currentMonth] || {};
        document.querySelectorAll('input').forEach(i => i.value = data[i.dataset.name] || "");
        calculate();
    }

    function saveData() {
        saveToMemory();
        localStorage.setItem('finance_db_v5', JSON.stringify(db));
        alert('資料已鎖定在手機中！');
    }

    function exportCSV() {
        let csv = "月份,項目,金額\n";
        for (let m = 1; m <= 12; m++) {
            if (db[m]) {
                Object.keys(db[m]).forEach(k => {
                    csv += `${m}月,${k},${db[m][k]}\n`;
                });
            }
        }
        const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "我的財務備份.csv";
        link.click();
    }

    function setupChart() {
        const ctx = document.getElementById('assetChart').getContext('2d');
        assetChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['資產', '負債'], datasets: [{ backgroundColor: ['#2ecc71', '#e74c3c'], data: [0, 0] }] }
        });
    }

    function updateChart(totalA) {
        let totalL = 0;
        document.querySelectorAll('.liability-in').forEach(i => totalL += Number(i.value || 0));
        assetChart.data.datasets[0].data = [totalA, totalL];
        assetChart.update();
    }

    window.onload = init;
</script>
</body>
</html>
